descripcionEs: |-
  Desarrollo de imágenes fotorrealistas para una vivienda unifamiliar ubicada en Costa Rica, realizadas durante mi colaboración en el estudio de Eduardo Navadijos.

  El trabajo se llevó a cabo con Lumion sobre modelos en Revit, elaborando renders exteriores e interiores para comunicar el proyecto, potenciar la calidad espacial de la propuesta y apoyar su presentación al cliente.
descripcionEn: |-
  Development of photorealistic images for a single-family house located in Costa Rica, produced during my collaboration at Eduardo Navadijos' studio.

  The work was carried out with Lumion on Revit models, producing exterior and interior renders to communicate the project, enhance the spatial quality of the proposal and support its presentation to the client.
