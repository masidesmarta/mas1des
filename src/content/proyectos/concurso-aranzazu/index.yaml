resumenEs: Un taller con viviendas que dialoga con el santuario de Arantzazu sin competir con él. Premio Accésit del concurso Pladur.
resumenEn: A workshop with housing that dialogues with the Sanctuary of Arantzazu without competing with it. Honourable mention at the Pladur competition.
descripcionEs: |-
  Proyecto elaborado para el concurso Pladur 2025: un taller con viviendas en Arantzazu. La propuesta busca no convertirse en protagonista ni competir con la basílica, sino acompañarla.

  Para ello reutiliza los mismos materiales del entorno e imita las formas puntiagudas de la iglesia, generando un camino y una vista controlada hacia el santuario. El ejercicio se resolvió íntegramente en Revit y se maquetó en Photoshop.

  Obtuvo el premio **Accésit** del concurso Pladur 2025.
descripcionEn: |-
  Project developed for the Pladur 2025 competition: a workshop with housing in Arantzazu. The proposal seeks not to become the protagonist nor to compete with the basilica, but to accompany it.

  To that end it reuses the same materials of the surroundings and echoes the church's pointed forms, creating a path and a controlled view towards the sanctuary. The exercise was resolved entirely in Revit and laid out in Photoshop.

  It received the **Honourable mention** (Accésit) at the Pladur 2025 competition.
