resumenEs: Intervención arquitectónica en el paisaje minero, entendida como herramienta para la regeneración ambiental del territorio.
resumenEn: An architectural intervention in the mining landscape, conceived as a tool for the environmental regeneration of the territory.
descripcionEs: |-
  Proyecto Fin de Máster planteado sobre el paisaje minero de las Minas de Riotinto (Huelva), entendiendo la arquitectura como una herramienta para la regeneración ambiental del lugar.

  La propuesta reutiliza las infraestructuras existentes y aprovecha los recursos del sitio para crear nuevos espacios de producción, investigación y encuentro. A través de soluciones pasivas, sistemas constructivos adaptados al entorno y un enfoque basado en la economía circular, el proyecto concilia memoria industrial, sostenibilidad e innovación arquitectónica.

  En el centro de la intervención, un gran mercado cubierto por una estructura textil ligera reordena el ciclo del agua y de los materiales de la mina, convirtiendo el residuo del proceso extractivo en el material que regenera el paisaje.
descripcionEn: |-
  Master's Final Project set on the mining landscape of the Riotinto Mines (Huelva), understanding architecture as a tool for the environmental regeneration of the place.

  The proposal reuses the existing infrastructure and takes advantage of the site's resources to create new spaces for production, research and gathering. Through passive solutions, construction systems adapted to the surroundings and a circular-economy approach, the project reconciles industrial memory, sustainability and architectural innovation.

  At the heart of the intervention, a large market covered by a light textile structure reorders the cycle of water and materials from the mine, turning the waste of the extraction process into the material that regenerates the landscape.
