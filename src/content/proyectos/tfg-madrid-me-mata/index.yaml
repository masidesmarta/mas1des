descripcionEs: |-
  Trabajo Fin de Grado que analiza el proceso de gentrificación que ha sufrido el barrio madrileño de Chueca hasta el día de hoy, con un enfoque comercial y social.

  El estudio recorre la transformación histórica del barrio —de la Movida madrileña a la homogeneización comercial actual— y reivindica sus lugares como espacios de convivencia más allá del consumo.

  Para descubrir más: [«Madrid me mata» en el repositorio de la Universidad de Alcalá](https://ebuah.uah.es/xmlui/handle/10017/66652).
descripcionEn: |-
  Final degree project analysing the gentrification process undergone by Madrid's Chueca neighbourhood up to the present day, with a commercial and social focus.

  The study traces the historical transformation of the neighbourhood —from the Movida madrileña to today's commercial homogenisation— and reclaims its places as spaces of coexistence beyond consumption.

  To find out more: [“Madrid me mata” in the University of Alcalá repository](https://ebuah.uah.es/xmlui/handle/10017/66652).
