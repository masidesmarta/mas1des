resumenEs: Cajas-casa semitransparentes que se elevan sobre las ruinas dejando paso al paisaje y la vegetación.
resumenEn: Semi-transparent house-boxes that rise over the ruins, giving way to the landscape and the vegetation.
descripcionEs: |-
  Proyecto residencial-taller ubicado en las ruinas de Touro (Ribeira, A Coruña). Los edificios no compiten con el paisaje: se elevan y se apiñan a distintas alturas, dejando espacio a la vista y a la vegetación mediante apoyos puntuales.

  Son cajas semitransparentes con forma de casa que encierran, a su vez, cajas a modo de habitación —una estrategia inspirada en el proyecto de viviendas Setonomori de Sou Fujimoto.

  El proyecto combina técnicas de collage para la composición de las plantas en Illustrator y Photoshop, con la gestión de planos en AutoCAD y Rhinoceros.
descripcionEn: |-
  Residential-workshop project set in the ruins of Touro (Ribeira, A Coruña). The buildings do not compete with the landscape: they rise and cluster at different heights, leaving room for the view and the vegetation through point supports.

  They are semi-transparent house-shaped boxes that, in turn, enclose room-like boxes —a strategy inspired by Sou Fujimoto's Setonomori housing project.

  The project combines collage techniques for the composition of the plans in Illustrator and Photoshop, with drafting managed in AutoCAD and Rhinoceros.
