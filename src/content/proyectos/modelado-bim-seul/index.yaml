descripcionEs: |-
  Proyecto final del Máster en BIM, basado en el edificio West Glow (oficinas y retail) de Society of Architecture, en Corea del Sur.

  A partir de los planos originales se levantó el modelo completo en Revit, con detalles y familias de elementos propios —muros, ventanas, barandillas y escaleras. El ejercicio permitió parametrizar y reconstruir un espacio real mediante el sistema BIM.

  Gestionado íntegramente en Revit, con imágenes elaboradas en Lumion y Enscape.
descripcionEn: |-
  Final project of the BIM Master's, based on the West Glow building (offices and retail) by Society of Architecture, in South Korea.

  From the original drawings, the complete model was built in Revit, with custom details and element families —walls, windows, railings and staircases. The exercise made it possible to parametrise and reconstruct a real space through the BIM system.

  Managed entirely in Revit, with images produced in Lumion and Enscape.
