resumenEs: Intervenciones paisajísticas para el parque Jennifer Hermoso, proyectadas junto a la universidad y el barrio.
resumenEn: Landscape interventions for Jennifer Hermoso Park, designed together with the university and the neighbourhood.
descripcionEs: |-
  En colaboración con la universidad analizamos a fondo el parque Jennifer Hermoso, en el Alto de Carabanchel, contando con la participación del barrio, y proyectamos una serie de intervenciones paisajísticas para mejorar su relación con el entorno.

  El proyecto se expuso en la sala de conferencias del espacio de la mujer en el Alto de Carabanchel.
descripcionEn: |-
  In collaboration with the university, we studied Jennifer Hermoso Park, in Alto de Carabanchel, in depth — with the participation of the neighbourhood — and designed a series of landscape interventions to improve its relationship with its surroundings.

  The project was exhibited in the conference room of the women's space in Alto de Carabanchel.
