resumenEs: Una escenografía efímera construida con granadas que cuestiona la permanencia de la arquitectura.
resumenEn: An ephemeral set built with pomegranates that questions the permanence of architecture.
descripcionEs: |-
  Esta intervención explora la fragilidad de la arquitectura a través de una escenografía construida con granadas. El fruto, asociado a la abundancia y al paso del tiempo, se convierte en un material efímero que transforma el espacio y cuestiona la permanencia.

  La performance, realizada en la Escuela Técnica Superior de Arquitectura de Madrid, pone en diálogo el cuerpo, la materia y el tiempo.
descripcionEn: |-
  This intervention explores the fragility of architecture through a set built with pomegranates. The fruit — associated with abundance and the passing of time — becomes an ephemeral material that transforms the space and questions permanence.

  The performance, staged at the Madrid School of Architecture (ETSAM), brings the body, matter and time into dialogue.
